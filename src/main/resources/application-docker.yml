server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/${DB_NAME:ecommerce_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}

  order:
    payment-timeout-minutes: ${ORDER_PAYMENT_TIMEOUT_MINUTES:15}
    expiration-batch-size: ${ORDER_EXPIRATION_BATCH_SIZE:50}
    expiration-scan-delay-ms: ${ORDER_EXPIRATION_SCAN_DELAY_MS:60000}
    expiration-initial-delay-ms: ${ORDER_EXPIRATION_INITIAL_DELAY_MS:30000}

auth:
  refresh-cookie:
    secure: ${AUTH_REFRESH_COOKIE_SECURE:false}
    same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}
