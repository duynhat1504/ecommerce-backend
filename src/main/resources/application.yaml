server:
  port: 8080

app:
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}

spring:
  application:
    name: ecommerce-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce_db
    username: postgres
    password: "nhat15042005"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - openid
              - profile
              - email


jwt:
  secret: "my-super-secret-key-my-super-secret-key-123456"
  access-token-expiration: 86400000
  #secret: key dùng để ký token
  #access-token-expiration: thời gian sống của token, đơn vị milliseconds
  #86400000 = 24 giờ
