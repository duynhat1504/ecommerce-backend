spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

app:
  frontend-url: ${APP_FRONTEND_URL}
  backend-url: ${BACKEND_URL}

  vnpay:
    pay-url: ${VNPAY_PAY_URL:}
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    return-url: ${VNPAY_RETURN_URL:}

auth:
  refresh-cookie:
    secure: true
    same-site: ${AUTH_REFRESH_COOKIE_SAME_SITE:Lax}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
