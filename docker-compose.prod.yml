services:
  backend:
    # CI publishes this immutable image tag. This override intentionally prevents
    # production servers from building a potentially different local checkout.
    build: !reset null
    image: ${DOCKER_IMAGE:?DOCKER_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    pull_policy: always
    ports: !reset []

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    container_name: ecommerce-caddy
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?API_DOMAIN is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge

volumes:
  caddy_data:
  caddy_config:
